[project]
name = "ask-toronto"
version = "0.1.0"
description = "NL-to-SQL over Toronto Open Data with abstention; studies how GGUF quantization affects calibration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # training (HF stack, MPS)
    "torch==2.15.0",
    "transformers==5.22.2",
    "peft==0.21.2",
    "trl==1.17.1",
    "accelerate==1.15.0",
    "datasets",
    "sentencepiece==0.2.3",
    # eval runtime (llama.cpp). Version pins the vendored llama.cpp commit.
    "llama-cpp-python==0.3.36",
    # GGUF conversion deps (convert_hf_to_gguf.py)
    "gguf==0.19.0",
    "safetensors",
    "numpy",
    # SQL
    "sqlglot==30.30.0",
    # utils
    "pyyaml",
    "psutil",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_toronto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
